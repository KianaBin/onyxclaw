# Snapshot captured 2026-08-22 after Template ID configuration.
# Secret values are intentionally excluded; only secretKeyRef names are retained.
# Source: deploy/huaweicloud-cce/onyxclaw-app-demo.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: onyxclaw-demo
  labels:
    app.kubernetes.io/part-of: onyxclaw
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: onyxclaw-provider-config
  namespace: onyxclaw-demo
data:
  providers.demo.json: |
    {
      "schemaVersion": 1,
      "defaultProvider": "huaweicloud-agentsphere",
      "providers": {
        "huaweicloud-agentsphere": {
          "displayName": "Huawei Cloud AgentSphere Sandbox (pending)",
          "protocol": "e2b-compatible",
          "api": {
            "baseUrl": "https://agentsphere.cn-south-1.myhuaweicloud.com",
            "privateNetworkOnly": true,
            "apiKeyEnv": "HUAWEICLOUD_AGENTSPHERE_E2B_API_KEY",
            "compatibilityVersion": "agentsphere-e2b-poc",
            "sdkPatch": "none",
            "requestTimeoutMs": 30000
          },
          "sandbox": {
            "templateId": "b42d35f0-3b55-4857-8a28-be2543808932",
            "timeoutMs": 600000,
            "onTimeout": "kill",
            "secure": true,
            "defaultUser": "node",
            "homeDir": "/home/node",
            "workspaceDir": "/home/node/.openclaw/workspace"
          },
          "openclaw": {
            "binary": "node /app/openclaw.mjs",
            "gatewayPort": 18789,
            "installMode": "preinstalled",
            "pluginInstallMode": "preinstalled"
          },
          "channel": {
            "publicUrl": "ws://192.168.2.13:18890/connect",
            "privateNetworkOnly": true,
            "connectTimeoutMs": 120000,
            "signingSecretEnv": "HUAWEICLOUD_AGENTSPHERE_CHANNEL_SIGNING_SECRET"
          },
          "model": {
            "provider": "deepseek",
            "model": "deepseek-v4-flash",
            "apiKeyEnv": "HUAWEICLOUD_AGENTSPHERE_MODEL_API_KEY"
          },
          "cleanupPolicy": "kill",
          "capabilities": {
            "pauseResume": false,
            "memoryPersistence": false,
            "publicEgress": false,
            "vpc": true
          }
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onyxclaw-app
  namespace: onyxclaw-demo
  labels:
    app.kubernetes.io/name: onyxclaw-app
    app.kubernetes.io/version: "0.3.8"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: onyxclaw-app
  template:
    metadata:
      labels:
        app: onyxclaw-app
        app.kubernetes.io/name: onyxclaw-app
        app.kubernetes.io/version: "0.3.8"
      annotations:
        onyxclaw.io/config-revision: "2026-08-22-template-b42d35f0"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: swr.cn-south-1.myhuaweicloud.com/demo-test/onyxclaw-app:0.3.8@sha256:a44493d9598f1a2beb2e8656d73d16b4680ca66e8acffa0de5aacbb721bbfbe0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
            - name: channel
              containerPort: 18890
          env:
            - name: ONYXCLAW_PROVIDER_CONFIG
              value: /app/config/providers.demo.json
            - name: ONYXCLAW_PROVIDER
              value: huaweicloud-agentsphere
            - name: ONYXCLAW_CLOUD_REGION
              value: cn-south-1
            - name: HUAWEICLOUD_AGENTSPHERE_E2B_API_KEY
              valueFrom:
                secretKeyRef:
                  name: onyxclaw-app-runtime
                  key: agentsphere-e2b-api-key
            - name: HUAWEICLOUD_AGENTSPHERE_MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: onyxclaw-app-runtime
                  key: model-api-key
            - name: HUAWEICLOUD_AGENTSPHERE_CHANNEL_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: onyxclaw-app-runtime
                  key: channel-signing-secret
            - name: ONYXCLAW_OPENCLAW_BASE_CONFIG_JSON
              valueFrom:
                secretKeyRef:
                  name: onyxclaw-app-runtime
                  key: openclaw-base-config-json
          volumeMounts:
            - name: provider-config
              mountPath: /app/config/providers.demo.json
              subPath: providers.demo.json
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: provider-config
          configMap:
            name: onyxclaw-provider-config
---
apiVersion: v1
kind: Service
metadata:
  name: onyxclaw-app
  namespace: onyxclaw-demo
spec:
  type: NodePort
  selector:
    app: onyxclaw-app
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: onyxclaw-channel
  namespace: onyxclaw-demo
spec:
  type: ClusterIP
  selector:
    app: onyxclaw-app
  ports:
    - name: channel
      port: 18890
      targetPort: channel
