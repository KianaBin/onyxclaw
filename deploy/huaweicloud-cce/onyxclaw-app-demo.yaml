apiVersion: v1
kind: Namespace
metadata:
  name: onyxclaw-demo
  labels:
    app.kubernetes.io/part-of: onyxclaw
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: onyxclaw-provider-config
  namespace: onyxclaw-demo
data:
  providers.demo.json: |
    {
      "schemaVersion": 1,
      "defaultProvider": "huaweicloud-agentsphere",
      "providers": {
        "huaweicloud-agentsphere": {
          "displayName": "Huawei Cloud AgentSphere Sandbox (pending)",
          "protocol": "e2b-compatible",
          "api": {
            "baseUrl": "https://agentsphere.cn-south-1.myhuaweicloud.com",
            "sandboxUrl": "https://agent-gateway-sandbox-muyden3dgi.agentgateway.cn-south-1.huaweicloud-agentnetwork.com",
            "privateNetworkOnly": true,
            "apiKeyEnv": "HUAWEICLOUD_AGENTSPHERE_E2B_API_KEY",
            "compatibilityVersion": "agentsphere-e2b-poc",
            "sdkPatch": "none",
            "requestTimeoutMs": 60000
          },
          "sandbox": {
            "templateId": "c4711224-04d5-4875-a934-47a4007db35e",
            "timeoutMs": 600000,
            "onTimeout": "pause",
            "secure": true,
            "defaultUser": "node",
            "homeDir": "/home/node",
            "workspaceDir": "/home/node/.openclaw/workspace",
            "metadata": {
              "agentsandbox.storage.sfs": "{\"sfsTurboMounts\":[{\"sfsTurboId\":\"d38073b5-7002-4279-ab54-32faff2a0132\",\"sharePath\":\"/hzp/workspace\",\"readOnly\":false,\"mountDir\":\"/home/node/.openclaw/workspace\"}]}"
            }
          },
          "openclaw": {
            "binary": "node /app/openclaw.mjs",
            "gatewayPort": 18789,
            "installMode": "preinstalled",
            "pluginInstallMode": "preinstalled"
          },
          "channel": {
            "publicUrl": "ws://192.168.2.13:18890/connect",
            "privateNetworkOnly": true,
            "connectTimeoutMs": 120000,
            "signingSecretEnv": "HUAWEICLOUD_AGENTSPHERE_CHANNEL_SIGNING_SECRET"
          },
          "model": {
            "provider": "deepseek",
            "model": "deepseek-v4-flash",
            "apiKeyEnv": "HUAWEICLOUD_AGENTSPHERE_MODEL_API_KEY"
          },
          "cleanupPolicy": "kill",
          "capabilities": {
            "pauseResume": true,
            "memoryPersistence": true,
            "publicEgress": false,
            "vpc": true
          }
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onyxclaw-app
  namespace: onyxclaw-demo
  labels:
    app.kubernetes.io/name: onyxclaw-app
    app.kubernetes.io/version: "0.3.8"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: onyxclaw-app
  template:
    metadata:
      labels:
        app: onyxclaw-app
        app.kubernetes.io/name: onyxclaw-app
        app.kubernetes.io/version: "0.3.8"
      annotations:
        onyxclaw.io/config-revision: "2026-08-24-white-ui-v2-template-c4711224"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: swr.cn-south-1.myhuaweicloud.com/demo-test/onyxclaw-app:0.3.8-white-ui-v2@sha256:138a6f5394e98fcdb0acbaabd49d2e91b7256180c7535b318799982bc39d831c
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
            - name: channel
              containerPort: 18890
          env:
            - name: ONYXCLAW_PROVIDER_CONFIG
              value: /app/config/providers.demo.json
            - name: ONYXCLAW_PROVIDER
              value: huaweicloud-agentsphere
            - name: ONYXCLAW_CLOUD_REGION
              value: cn-south-1
            - name: HUAWEICLOUD_AGENTSPHERE_E2B_API_KEY
              valueFrom:
                secretKeyRef:
                  name: onyxclaw-app-runtime
                  key: agentsphere-e2b-api-key
            - name: HUAWEICLOUD_AGENTSPHERE_MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: onyxclaw-app-runtime
                  key: model-api-key
            - name: HUAWEICLOUD_AGENTSPHERE_CHANNEL_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: onyxclaw-app-runtime
                  key: channel-signing-secret
            - name: E2B_DATA_SESSION_WAIT_SECONDS
              value: "45"
            - name: ONYXCLAW_OPENCLAW_BASE_CONFIG_JSON
              valueFrom:
                secretKeyRef:
                  name: onyxclaw-app-runtime
                  key: openclaw-base-config-json
          volumeMounts:
            - name: provider-config
              mountPath: /app/config/providers.demo.json
              subPath: providers.demo.json
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: provider-config
          configMap:
            name: onyxclaw-provider-config
---
apiVersion: v1
kind: Service
metadata:
  name: onyxclaw-app
  namespace: onyxclaw-demo
spec:
  type: NodePort
  selector:
    app: onyxclaw-app
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: onyxclaw-channel
  namespace: onyxclaw-demo
spec:
  type: ClusterIP
  selector:
    app: onyxclaw-app
  ports:
    - name: channel
      port: 18890
      targetPort: channel
